// ─── TEXT GENERATION ───
async function callOpenRouter(mk, model, sysPrompt, userPrompt) {
  const key = getApiKey(mk);
  const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', headers: apiHeaders(key),
    body: JSON.stringify({ model, messages: [{ role: 'system', content: sysPrompt }, { role: 'user', content: userPrompt }], temperature: 0.95, max_tokens: 2000 }),
  });
  if (!resp.ok) { const e = await resp.json().catch(() => ({})); throw new Error(e.error?.message || 'API error: ' + resp.status); }
  return (await resp.json()).choices[0].message.content;
}

// Generate N distinct post variations on the same topic. Each takes a
// different angle so the user gets N separate posts (not N images of one post).
async function callOpenRouterMultiPost(mk, model, sysPrompt, userPromptCore, count, opts) {
  opts = opts || {};
  const key = getApiKey(mk);
  const cfg = getPillarConfig(opts.pillarName || '');
  const allHookKeys = ['bold_stat', 'contrarian', 'direct_question', 'pov_scenario', 'story_opener', 'reframe'];
  const preferred = cfg ? cfg.bestHooks : [];
  const ordered = preferred.concat(allHookKeys.filter(function(h) { return preferred.indexOf(h) < 0; }));
  const chosenKeys = ordered.slice(0, count);
  const hookBriefs = chosenKeys.map(function(k, i) { var hf = HOOK_FORMULAS[k]; return (i + 1) + '. ' + hf.name + ' \u2014 ' + hf.brief; }).join('\n');
  const trendingClause = opts.hasTrendingTopic
    ? ('\n\nTRENDING TOPIC HANDLING:\n- Post 1 covers the trending topic specified above.\n- Posts 2-' + count + ' MUST cover OTHER topics within the ' + (opts.pillarName || 'pillar') + '. Do NOT discuss the trending topic in posts 2-' + count + '. Pick recent issues, stats, or angles that are completely different.')
    : '';
  const wrapper = '\n\nGENERATE EXACTLY ' + count + ' POSTS, EACH ON A COMPLETELY DIFFERENT TOPIC within the ' + (opts.pillarName || 'selected') + ' pillar.\n\n' +
    'CRITICAL TOPIC DIVERSITY RULE:\n' +
    'Each of the ' + count + ' posts must address a DIFFERENT news event, statistic, regulation, trend, or scenario. NO TWO POSTS may cover the same underlying subject. Three angles on the same Medicare reimbursement cut is NOT acceptable. Three different topics from within healthcare workforce is what is required.\n\n' +
    'Examples of distinct topics within a single pillar:\n' +
    '- Workforce Insights: physician shortage projections; rural-vs-urban coverage gaps; residency expansion legislation; hospital closure rates; locum tenens adoption.\n' +
    '- Each item above is its OWN topic, not the same topic from a different angle.\n\n' +
    'Each post uses a DIFFERENT hook formula from this list (no repeats):\n' + hookBriefs + trendingClause +
    '\n\nFor each post:\n- The first line is the hook and MUST follow the assigned formula.\n' +
    '- The first line MUST be 15 words or fewer.\n' +
    '- The post MUST be on a topic that is DISTINCT from all the other posts in this batch.\n' +
    '- Follow the pillar 7-beat sequence (defined above) for the body.\n' +
    '- ZERO em dashes. Use commas, periods, colons, or line breaks instead.\n' +
    '- Reader is the main character. Frame from THEIR perspective.\n' +
    '- 150-300 words per post.\n' +
    '- End with a soft CTA (no engagement bait) and 3-5 hashtags.\n\n' +
    'Return ONLY a JSON array of exactly ' + count + ' strings, each string is one full post in the order above (post 1 uses hook formula 1 + topic 1, post 2 uses hook formula 2 + a DIFFERENT topic, etc.).\n' +
    'NO code fences. NO commentary. NO labels. Just the raw JSON array.';
  const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', headers: apiHeaders(key),
    body: JSON.stringify({ model, messages: [{ role: 'system', content: sysPrompt }, { role: 'user', content: userPromptCore + wrapper }], temperature: 0.95, max_tokens: 4000 }),
  });
  if (!resp.ok) { const e = await resp.json().catch(() => ({})); throw new Error(e.error?.message || 'API error: ' + resp.status); }
  const raw = (await resp.json()).choices[0].message.content;
  let posts = parseJsonStringArray(raw);
  if (!posts || posts.length === 0) throw new Error('Could not parse post variations from AI response');
  posts = posts.map(function(p) { return stripEmDashes(p); });
  while (posts.length < count) posts.push(posts[posts.length - 1]);
  return posts.slice(0, count);
}

function parseJsonStringArray(raw) {
  if (!raw) return null;
  let cleaned = String(raw).trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
  const m = cleaned.match(/\[[\s\S]*\]/);
  if (!m) return null;
  try {
    const arr = JSON.parse(m[0]);
    if (!Array.isArray(arr)) return null;
    return arr.map(function(x) { return String(x).trim(); }).filter(function(x) { return x.length > 0; });
  } catch (e) {
    const fallback = String(raw).split(/\n\s*\d+\.\s+/).map(function(x) { return x.trim(); }).filter(function(x) { return x.length > 40; });
    if (fallback.length >= 2) return fallback;
    return null;
  }
}

// ─── IMAGE URL EXTRACTION ───
function extractImageUrl(data) {
  const msg = data.choices && data.choices[0] && data.choices[0].message;
  const content = msg && msg.content;
  if (msg && msg.images && msg.images.length > 0) {
    const img = msg.images[0];
    if (typeof img === 'string') return img;
    if (img.image_url && img.image_url.url) return img.image_url.url;
    if (img.url) return img.url;
  }
  if (data.choices && data.choices[0] && data.choices[0].native_images && data.choices[0].native_images.length > 0) return data.choices[0].native_images[0];
  if (Array.isArray(content)) {
    for (var i = 0; i < content.length; i++) {
      var part = content[i];
      if (part.type === 'image_url' && (part.image_url && part.image_url.url || part.url)) return (part.image_url && part.image_url.url) || part.url;
      if (part.type === 'image') {
        if (part.source && part.source.data) return 'data:' + (part.source.media_type || 'image/png') + ';base64,' + part.source.data;
        if (part.image_url && part.image_url.url) return part.image_url.url;
        if (part.url) return part.url;
      }
    }
  }
  if (typeof content === 'string') {
    var b64 = content.match(/data:image\/[^;]+;base64,[A-Za-z0-9+\/=]+/);
    if (b64) return b64[0];
    var md = content.match(/!\[.*?\]\((.*?)\)/);
    if (md) return md[1];
    var extUrl = content.match(/(https?:\/\/[^\s"'\)]+\.(png|jpg|jpeg|webp|gif)[^\s"'\)]*)/i);
    if (extUrl) return extUrl[1];
    var lineUrl = content.trim().match(/^(https?:\/\/[^\s]+)$/m);
    if (lineUrl) return lineUrl[1];
  }
  return null;
}

// ─── BATCH IMAGE GENERATION ───
async function generateMultipleImages(mk, imageModel, prompts, onProgress) {
  const results = [];
  const fallbackModels = IMAGE_MODELS.filter(function(m) { return m.id !== imageModel; }).map(function(m) { return m.id; });
  for (var i = 0; i < prompts.length; i++) {
    if (onProgress) onProgress(i, prompts.length);
    var success = false;
    var modelsToTry = [imageModel].concat(fallbackModels.slice(0, 2));
    for (var j = 0; j < modelsToTry.length; j++) {
      try { var url = await callImageAPI(mk, modelsToTry[j], prompts[i]); results.push({ url: url, prompt: prompts[i], error: null, model: modelsToTry[j] }); success = true; break; } catch(e) { console.warn('[LeadGen] Image ' + (i+1) + ' failed on ' + modelsToTry[j] + ':', e.message); }

function generateMultiCard(cv, opts) {

  ctx.fillStyle = s.bg; ctx.fillRect(0, 0, W, H);
  const pad2 = (x) => String(x).padStart(2, '0');
  const counter = opts.slideCounter || (pad2(n) + ' / ' + pad2(total));
  sfCounter(ctx, counter, pad, pad + 16, s.counter);
  const title = opts.title || opts.topicLabel || 'Insight';
  const titleMaxLines = orient === 'portrait' ? 3 : 2;
  const tSize = sfFitFontToLines(ctx, title, (n) => '800 ' + n + 'px Inter, Helvetica, Arial, sans-serif', W - pad * 2, titleMaxLines, orient === 'portrait' ? 68 : 54, orient === 'portrait' ? 38 : 30);
  ctx.fillStyle = s.headline;

  ctx.textAlign = 'left';
  const titleY = pad + 72 + tSize;
  const titleEndY = sfWrap(ctx, title, pad, titleY, W - pad * 2, tSize + 10, titleMaxLines);
  const accentY = titleEndY + 22;
  sfAccent(ctx, pad, accentY, Math.min(160, Math.round(W * 0.14)), s.accent, 5);
  let bodyY = accentY + 40; const bodyX = pad; const bodyW = W - pad * 2;
  if (Array.isArray(opts.points) && opts.points.length) {
    const bs = orient === 'portrait' ? 30 : 24;
    ctx.font = '500 ' + bs + 'px Inter, Helvetica, Arial, sans-serif';
    opts.points.forEach((pt) => {
      ctx.fillStyle = s.accent; ctx.beginPath(); ctx.arc(bodyX + 8, bodyY + bs / 2 - 4, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = s.body;
      const ey = sfWrap(ctx, pt, bodyX + 30, bodyY + bs - 6, bodyW - 30, bs + 8, 2);
      bodyY = ey + bs + 12;

  } else if (Array.isArray(opts.rows) && opts.rows.length) {
    const bs = orient === 'portrait' ? 30 : 24;
    opts.rows.forEach((row) => {
      const label = row.label || ''; const value = row.value || '';
      ctx.fillStyle = s.headline; ctx.font = '800 ' + bs + 'px Inter, Helvetica, Arial, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(label, bodyX, bodyY); const labelW = ctx.measureText(label).width;
      ctx.fillStyle = s.accentSoft; ctx.font = '600 ' + bs + 'px Inter, Helvetica, Arial, sans-serif';
      ctx.fillText(' \u2014 ', bodyX + labelW, bodyY); const dashW = ctx.measureText(' \u2014 ').width;
      ctx.fillStyle = s.body; ctx.font = '500 ' + bs + 'px Inter, Helvetica, Arial, sans-serif';
      sfWrap(ctx, value, bodyX + labelW + dashW, bodyY, bodyW - labelW - dashW, bs + 6, 2);
      bodyY += bs + 18;
    });
  } else if (Array.isArray(opts.numbered) && opts.numbered.length) {
    const bs = orient === 'portrait' ? 30 : 24;
    ctx.font = '500 ' + bs + 'px Inter, Helvetica, Arial, sans-serif';
    opts.numbered.forEach((pt, i) => {
      ctx.fillStyle = s.body; ctx.textAlign = 'left';
      const num = (i + 1) + '.'; ctx.fillText(num, bodyX, bodyY);
      const numW = ctx.measureText(num + '  ').width;
      const ey = sfWrap(ctx, pt, bodyX + numW, bodyY, bodyW - numW, bs + 8, 2);
      bodyY = ey + bs + 10;
    });
  } else {
    if (opts.subtitle) {
      const bs = orient === 'portrait' ? 30 : 26;
      ctx.fillStyle = s.body; ctx.font = '500 ' + bs + 'px Inter, Helvetica, Arial, sans-serif';
      bodyY = sfParas(ctx, opts.subtitle, bodyX, bodyY + bs, bodyW, bs + 10, s.body);
    }
    if (opts.subSubtitle) {
      const bs = orient === 'portrait' ? 26 : 22;

      bodyY = sfParas(ctx, opts.subSubtitle, bodyX, bodyY + bs + 14, bodyW, bs + 8, s.bodySoft);
    }
  }
  if (opts.closingLine) {
    const cSize = orient === 'portrait' ? 32 : 26;
    ctx.fillStyle = s.headline; ctx.font = '800 ' + cSize + 'px Inter, Helvetica, Arial, sans-serif'; ctx.textAlign = 'left';
    const cy = Math.min(bodyY + cSize + 28, H - pad - 28);

  }
  sfFooter(ctx, W, H, s, opts.brandName);
}

// ─── FormattedPost ───
function FormattedPost({ text }) {
  if (!text) return null;
  const lines = text.split('\n');
  const elements = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim() === '') { elements.push(React.createElement('div', { key: i, className: 'h-2' })); continue; }
    const bulletMatch = line.match(/^\s*([\u2192\u2022\-\*]|\d+[\.\)])\s+(.*)/);
    if (bulletMatch) {
      const marker = bulletMatch[1];
      const content = bulletMatch[2];
      elements.push(React.createElement('div', { key: i, className: 'flex items-start gap-2 pl-2 py-0.5' },
        React.createElement('span', { className: 'text-blue-500 font-bold flex-shrink-0 mt-0.5' }, marker === '-' || marker === '*' ? '\u2192' : marker),
        React.createElement('span', null, renderInline(content))
      ));
      continue;
    }
    elements.push(React.createElement('p', { key: i, className: 'py-0.5' }, renderInline(line)));
  }
  return React.createElement(React.Fragment, null, ...elements);
}

function renderInline(text) {
  if (!text) return text;
  const parts = []; let remaining = text, key = 0;
  while (remaining.length > 0) {
    const boldMatch = remaining.match(/\*\*(.+?)\*\*/);
    if (boldMatch) {
      const idx = remaining.indexOf(boldMatch[0]);
      if (idx > 0) parts.push(React.createElement('span', { key: key++ }, remaining.substring(0, idx)));
      parts.push(React.createElement('strong', { key: key++, className: 'font-bold text-gray-900' }, boldMatch[1]));
      remaining = remaining.substring(idx + boldMatch[0].length);
      continue;
    }
    parts.push(React.createElement('span', { key: key++ }, remaining));
    break;
  }
  return parts.length === 1 ? parts[0] : parts;
}

// One Generate click fills the whole week: POSTS_PER_DAY x WEEKDAYS = 15 posts.

function GeneratePage({ brand, manualKey, selModel, selImgModel, live, showToast, savedPosts, setSavedPosts }) {
  const [platform, setPlatform] = useState('LinkedIn');

  const [posts, setPosts] = useState([]);
  const [post, setPost] = useState('');
  const [loading, setLoading] = useState(false);
  const [imgLoading, setImgLoading] = useState(false);
  const [imgProgress, setImgProgress] = useState('');
  const [error, setError] = useState('');
  const [images, setImages] = useState([]);
  const [selectedImg, setSelectedImg] = useState(0);
  const [genPhase, setGenPhase] = useState('');
  const cvRef = useRef(null);

  // Sync displayed post with selected card index
  useEffect(() => {
    if (posts.length > 0 && posts[selectedImg] !== undefined) setPost(posts[selectedImg]);
  }, [selectedImg, posts]);

  const pillar = brand.pillars[pillarIdx] || brand.pillars[0];
  const parseList = (str) => str.split(/[,\n]+/).map((s) => s.trim()).filter(Boolean);

  const loadTrending = async () => {

  const makeBrandedCard = (postText, cardIndex, totalCards, ctx) => {
    const cv = cvRef.current; if (!cv) return null;
    const variant = cardIndex % 2 === 0 ? 'dark' : 'light';
    const facets = extractPostFacets(postText, ctx && ctx.trending, ctx && ctx.topicHint);

    if (imageStyle === 'stat') {
      const sl = facets.numericFacts[0] || (dp.length ? parseStatLine(dp[cardIndex % dp.length]) : { stat: 'Insight', label: facets.hook || (pillar.name + ' insights') });
      generateStatCard(cv, { stat: sl.stat, label: sl.label, subtitle: facets.topicLabel ? facets.topicLabel.toLowerCase() : (pillar.name + ' \u00B7 ' + (brand.tagline || '')).trim(), brandName: brand.name, orientation: 'portrait', variant: variant });

  const autoSaveBatchToArchive = (postTexts, imgsList, ctx) => {
    if (!postTexts || postTexts.length === 0) return;
    const now = new Date();
    const WD = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

    const now = new Date();
    setSavedPosts((current) => {
      const newEntries = postTexts.map(function(txt, i) {
        const successImgs = (imgsList[i] || []).filter((img) => img && img.url);

          id: Date.now() + Math.floor(Math.random() * 100000) + i,

          pillar: ctx.pillar.name,

          tone: ctx.tone,

          imageMode: 'branded',

        React.createElement('button', { className: 'btn-secondary', onClick: () => { if (!np.name) return; upd('pillars', [...eb.pillars, { ...np }]); setNp({ name:'', audience:'', description:'' }); } }, '+ Add')
      )
    ),
    // Data Points
    React.createElement('div', { className: 'card p-5' },
      React.createElement('h2', { className: 'text-lg font-bold text-white mb-4' }, '\uD83D\uDCCA Data Points'),
      React.createElement('div', { className: 'space-y-1 mb-3' },
        ...(eb.dataPoints || []).map((dp, i) => React.createElement('div', { key: i, className: 'flex items-center gap-2 text-sm' },
          React.createElement('span', { className: 'text-blue-400' }, '\u2192'),
          React.createElement('span', { className: 'text-gray-300 flex-1' }, dp),
          React.createElement('button', { className: 'text-red-400 hover:text-red-300 text-xs', onClick: () => upd('dataPoints', eb.dataPoints.filter((_, j) => j !== i)) }, '\u2715')
        ))
      ),
      React.createElement('div', { className: 'flex gap-2' },
        React.createElement('input', { className: 'input-field flex-1', placeholder: 'e.g., 86,000 projected physician shortage by 2036', value: ndp, onChange: (e) => setNdp(e.target.value), onKeyDown: (e) => { if (e.key === 'Enter' && ndp) { upd('dataPoints', [...(eb.dataPoints||[]), ndp]); setNdp(''); } } }),
        React.createElement('button', { className: 'btn-secondary', onClick: () => { if (!ndp) return; upd('dataPoints', [...(eb.dataPoints||[]), ndp]); setNdp(''); } }, '+ Add')
      )
    )
  );
}

// ═══════════ PERSISTENCE HELPERS ═══════════
// localStorage has a hard quota (~5-10 MB). PNG image data URLs add up
// fast, so we degrade gracefully: try full save → drop allImages → drop
// all images → keep text only. The user's text content is never lost.
const STORAGE_KEY = 'leadgen.savedPosts.v1';
const KEY_STORAGE_KEY = 'leadgen.manualKey.v1';
const BRAND_STORAGE_KEY = 'leadgen.brand.v1';
const TEXTMODEL_STORAGE_KEY = 'leadgen.selModel.v1';
const IMGMODEL_STORAGE_KEY = 'leadgen.selImgModel.v1';

function loadSavedPosts() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.warn('[LeadGen] Could not load saved posts:', e);
    return [];
  }
}

function persistSavedPosts(posts) {
  const tryWrite = (data) => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  };
  try {
    tryWrite(posts);
    return { ok: true };
  } catch (e) {
    // First fallback: drop the allImages array, keep just the cover image
    try {
      const trimmed = posts.map((p) => ({ ...p, allImages: p.imageData ? [p.imageData] : [] }));
      tryWrite(trimmed);
      return { ok: true, degraded: 'extra-images-dropped' };
    } catch (e2) {
      // Second fallback: drop all images
      try {
        const minimal = posts.map((p) => ({ ...p, imageData: null, allImages: [] }));
        tryWrite(minimal);
        return { ok: true, degraded: 'all-images-dropped' };
      } catch (e3) {
        return { ok: false, error: e3.message };
      }
    }
  }
}

function loadString(key, fallback) {
  try { return localStorage.getItem(key) || (fallback || ''); } catch (e) { return fallback || ''; }
}
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}

// ═══════════ POST → CARD CONTENT EXTRACTION ═══════════
const HASHTAG_RX = /#\w+/g;
const NUM_RX = /(\$?\d[\d,]*(?:\.\d+)?[KMB]?%?\+?)/g;
const BULLET_RX = /^\s*([\u2192\u2022\u25BA\u25CF\-\*])\s+(.*)/;
const NUMBERED_RX = /^\s*(\d+[\.\)])\s+(.*)/;
function stripMarkdown(s) {
  if (!s) return '';
  let out = String(s);
  out = out.replace(/```[\s\S]*?```/g, ' ');
  out = out.replace(/`([^`]+)`/g, '$1');
  out = out.replace(/\*\*([^*]+)\*\*/g, '$1');
  out = out.replace(/\*([^*]+)\*/g, '$1');
  out = out.replace(/__([^_]+)__/g, '$1');
  out = out.replace(/_([^_]+)_/g, '$1');
  out = out.replace(/[*_]+/g, '');
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1');
  out = out.replace(/^[#>]+\s*/gm, '');
  out = out.replace(/[ \t]+/g, ' ').trim();
  return out;
}
function shortenWords(s, max) {
  if (!s) return '';
  const cleaned = stripMarkdown(String(s)).trim();
  const w = cleaned.split(/\s+/);
  if (w.length <= max) return w.join(' ');
  return w.slice(0, max).join(' ') + '\u2026';
}
function parseStatLine(line) {
  const s = String(line || '').trim();
  const m = s.match(/^([\$\d,\.%\+]+[KMB]?%?)\s*(.*)/);
  if (m && m[1]) return { stat: m[1], label: (m[2] || '').trim() || s };
  return { stat: shortenWords(s, 1) || 'Insight', label: shortenWords(s, 14) };
}
function extractPostFacets(postText, trending, topicHint) {
  const fallbackTopic = (trending && trending.topic) || topicHint || 'Insight';
  if (!postText) return { topic: fallbackTopic, topicLabel: String(fallbackTopic).toUpperCase(), hook: '', paragraphs: [], bullets: [], sentences: [], numericFacts: [], closing: '' };
  const raw = stripMarkdown(String(postText)).trim();
  const linesAll = raw.split('\n').map((l) => l.replace(HASHTAG_RX, '').trim());
  const lines = linesAll.filter((l) => l.length > 0);
  const bullets = []; const paragraphs = [];
  for (const l of lines) {
    const bm = l.match(BULLET_RX); const nm = l.match(NUMBERED_RX);
    if (bm) bullets.push(bm[2].trim());
    else if (nm) bullets.push(nm[2].trim());
    else paragraphs.push(l);
  }
  const hook = paragraphs[0] || bullets[0] || lines[0] || '';
  const closing = paragraphs[paragraphs.length - 1] || bullets[bullets.length - 1] || hook;
  const sentences = [];
  for (const p of paragraphs) {
    const parts = p.split(/(?<=[.!?])\s+/).map((x) => x.trim()).filter((x) => x.length > 4);
    for (const sp of parts) sentences.push(sp);
  }
  const numericFacts = []; const seen = new Set();
  for (const l of lines) {
    const nums = l.match(NUM_RX) || [];
    for (const n of nums) {
      if (n.length < 2 && !/[KMB%$]/.test(n)) continue;
      if (seen.has(n)) continue; seen.add(n);
      const label = l.replace(n, '').replace(/\s+/g, ' ').trim();
      numericFacts.push({ stat: n, label: shortenWords(label, 14) || hook || fallbackTopic });
      if (numericFacts.length >= 8) break;
    }
    if (numericFacts.length >= 8) break;
  }
  let topic = fallbackTopic;
  if (!trending && !topicHint) topic = shortenWords(hook, 6) || fallbackTopic;
  return { topic, topicLabel: String(topic).toUpperCase(), hook, paragraphs, bullets, sentences, numericFacts, closing };
}
function buildQuoteSlides(facets) {
  const pool = [facets.hook, ...facets.sentences, ...facets.bullets, facets.closing]
    .map((s) => String(s || '').trim())
    .filter((s) => s.length >= 8 && s.split(/\s+/).length <= 22)
    .filter((s, i, a) => a.indexOf(s) === i);
  const picks = [];
  for (let i = 0; i < 5; i++) {
    if (pool.length > 0) picks.push(pool[i % pool.length]);
    else picks.push(facets.hook || facets.topicLabel || 'Insight');
  }
  const support = [...facets.bullets, ...facets.sentences]
    .map((s) => String(s || '').trim())
    .filter((s) => s.length >= 8 && s.split(/\s+/).length <= 22)
    .filter((s, i, a) => a.indexOf(s) === i);
  return picks.map((q, i) => {
    let supporting = '';
    for (let k = 0; k < support.length; k++) {
      const cand = support[(i + k) % support.length];
      if (cand && cand !== q) { supporting = cand; break; }
    }
    return {
      quote: shortenWords(q, 12),
      context: shortenWords(supporting, 16),
      closing: shortenWords(facets.closing || facets.hook || '', 8),
    };
  });
}
function stripPlainText(s) {
  if (!s) return '';
  return String(s).replace(/^[\s\u2192\u2022\u25BA\u25CF\-\*]+\s*/, '').replace(/^\d+[\.\)]\s*/, '').trim();
}
function buildMultiSlides(facets, count) {
  const { topicLabel, hook, paragraphs, bullets, sentences, numericFacts, closing } = facets;
  const pool = [...bullets, ...sentences, ...paragraphs]
    .map((s) => stripPlainText(s))
    .filter((s) => s && s.length >= 8)
    .filter((s, i, a) => a.indexOf(s) === i);
  const pickFrom = (i) => pool.length ? pool[i % pool.length] : (hook || closing || 'Insight');
  const s1 = { topic: topicLabel || 'INSIGHT', title: shortenWords(hook || pickFrom(0), 8), sub: shortenWords(pickFrom(1), 14), subSub: '' };
  let s2;
  if (numericFacts.length > 0) {
    const nf = numericFacts[0];
    s2 = { topic: 'BY THE NUMBERS', title: nf.stat, sub: shortenWords(nf.label, 14), subSub: numericFacts[1] ? shortenWords(numericFacts[1].stat + ' \u2014 ' + numericFacts[1].label, 12) : '' };
  } else {
    s2 = { topic: 'WHY IT MATTERS', title: shortenWords(pickFrom(2), 8), sub: shortenWords(pickFrom(3), 14), subSub: '' };
  }
  let s3, s4;
  if (bullets.length >= 2) {
    const half = Math.ceil(bullets.length / 2);
    s3 = { topic: 'KEY POINTS', title: 'What matters:', points: bullets.slice(0, half).map((b) => shortenWords(b, 12)) };
    s4 = { topic: 'AND THEN', title: 'And then:', points: bullets.slice(half).map((b) => shortenWords(b, 12)) };
  } else if (bullets.length === 1) {
    s3 = { topic: 'KEY POINT', title: shortenWords(bullets[0], 10), sub: shortenWords(pickFrom(4), 14), subSub: '' };
    s4 = { topic: 'CONTEXT', title: shortenWords(pickFrom(5), 10), sub: shortenWords(pickFrom(6), 14), subSub: '' };
  } else {
    s3 = { topic: 'CONTEXT', title: shortenWords(pickFrom(2), 10), sub: shortenWords(pickFrom(3), 14), subSub: '' };
    s4 = { topic: 'INSIGHT', title: shortenWords(pickFrom(4), 10), sub: shortenWords(pickFrom(5), 14), subSub: '' };
  }
  const s5 = { topic: 'THE TAKEAWAY', title: shortenWords(closing || hook || pickFrom(7), 10), sub: '', subSub: '' };
  const slides = [s1, s2, s3, s4, s5];
  const seen = new Set();
  for (let i = 0; i < slides.length; i++) {
    const sl = slides[i];
    const key = (sl.title || '') + '|' + ((sl.points || []).join('|'));
    if (seen.has(key)) sl.title = shortenWords(pickFrom(7 + i), 10);
    seen.add(key);
  }
  while (slides.length < count) slides.push(slides[slides.length - 1]);
  return slides.slice(0, count);
}

// ═══════════ APP ═══════════
function App() {
  const [page, setPage] = useState('generate');
  const [brand, setBrand] = useState(() => loadJSON(BRAND_STORAGE_KEY, STEADFAST_PRESET));
  const [manualKey, setManualKey] = useState(() => loadString(KEY_STORAGE_KEY, ''));
  const [selModel, setSelModel] = useState(() => loadString(TEXTMODEL_STORAGE_KEY, TEXT_MODELS[0].id));
  const [selImgModel, setSelImgModel] = useState(() => loadString(IMGMODEL_STORAGE_KEY, IMAGE_MODELS[0].id));
  const [toast, setToast] = useState(null);
  const [savedPosts, setSavedPosts] = useState(() => loadSavedPosts());
  const firstRenderRef = useRef(true);
  const live = isLiveMode(manualKey);
  const showToast = (msg) => setToast(msg);

  // Persist savedPosts whenever they change (skip first render to avoid
  // overwriting freshly loaded data with itself).
  useEffect(() => {
    if (firstRenderRef.current) { firstRenderRef.current = false; return; }
    const result = persistSavedPosts(savedPosts);
    if (!result.ok) {
      setToast('Storage full \u2014 could not save Archive. Delete some posts to free space.');
    } else if (result.degraded === 'extra-images-dropped') {
      console.warn('[LeadGen] Storage near full \u2014 dropping extra images from saved posts.');
    } else if (result.degraded === 'all-images-dropped') {
      setToast('Storage full \u2014 saved text only. Older images may be lost on next load.');
    }
  }, [savedPosts]);

  // Persist API key, brand, model selection
  useEffect(() => {
    try { localStorage.setItem(KEY_STORAGE_KEY, manualKey || ''); } catch (e) {}
  }, [manualKey]);
  useEffect(() => {
    try { localStorage.setItem(BRAND_STORAGE_KEY, JSON.stringify(brand)); } catch (e) {}
  }, [brand]);
  useEffect(() => {
    try { localStorage.setItem(TEXTMODEL_STORAGE_KEY, selModel || ''); } catch (e) {}
  }, [selModel]);
  useEffect(() => {
    try { localStorage.setItem(IMGMODEL_STORAGE_KEY, selImgModel || ''); } catch (e) {}
  }, [selImgModel]);

  return React.createElement('div', { className: 'min-h-screen gradient-bg' },
    React.createElement(Header, { brand, manualKey, setManualKey, live }),
    React.createElement(NavBar, { page, setPage }),
    React.createElement('main', { className: 'p-6 max-w-7xl mx-auto' },
      // Always-mounted pages preserve state across navigation. Only the active page is visible.
      React.createElement('div', { style: { display: page === 'generate' ? 'block' : 'none' } },
        React.createElement(GeneratePage, { brand, manualKey, selModel, selImgModel, live, showToast, savedPosts, setSavedPosts })
      ),
      React.createElement('div', { style: { display: page === 'calendar' ? 'block' : 'none' } },
        React.createElement(CalendarPage, { brand })
      ),
      React.createElement('div', { style: { display: page === 'archive' ? 'block' : 'none' } },
        React.createElement(ArchivePage, { savedPosts, setSavedPosts, showToast })
      ),
      React.createElement('div', { style: { display: page === 'saved' ? 'block' : 'none' } },
        React.createElement(SavedPage, { savedPosts, setSavedPosts, showToast })
      ),
      React.createElement('div', { style: { display: page === 'images' ? 'block' : 'none' } },
        React.createElement(ImageStudioPage, { brand, manualKey, selImgModel, live, showToast })
      ),
      React.createElement('div', { style: { display: page === 'settings' ? 'block' : 'none' } },
        React.createElement(SettingsPage, { brand, setBrand, manualKey, setManualKey, selModel, setSelModel, selImgModel, setSelImgModel, live })
      )
    ),
    toast && React.createElement(Toast, { message: toast, onClose: () => setToast(null) })
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
