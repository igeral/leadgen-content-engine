<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ═══════════ API KEY ═══════════
const ENV_API_KEY = '';

function getApiKey(manualKey) {
  return (manualKey || '').trim() || ENV_API_KEY.trim();
}
function isLiveMode(manualKey) {
  return getApiKey(manualKey).length > 0;
}
function isUsingEnvKey(manualKey) {
  return !(manualKey || '').trim() && ENV_API_KEY.trim().length > 0;
}

// ═══════════ MODELS ═══════════
const TEXT_MODELS = [
  { id: 'anthropic/claude-sonnet-4', name: 'Claude Sonnet 4 (Best for content)', tier: 'premium' },
  { id: 'openai/gpt-4o', name: 'GPT-4o (Great all-rounder)', tier: 'premium' },
  { id: 'google/gemini-2.5-pro-preview', name: 'Gemini 2.5 Pro (Strong writer)', tier: 'premium' },
  { id: 'anthropic/claude-haiku-4', name: 'Claude Haiku 4 (Fast & cheap)', tier: 'budget' },
  { id: 'openai/gpt-4o-mini', name: 'GPT-4o Mini (Budget-friendly)', tier: 'budget' },
  { id: 'meta-llama/llama-4-maverick', name: 'Llama 4 Maverick (Open source)', tier: 'budget' },
];

const IMAGE_MODELS = [
  { id: 'openai/gpt-5-image', name: 'GPT-5 Image (Best quality)', modalities: ['image', 'text'] },
  { id: 'openai/gpt-5-image-mini', name: 'GPT-5 Image Mini (Fast)', modalities: ['image', 'text'] },
  { id: 'google/gemini-2.5-flash-image', name: 'Gemini 2.5 Flash Image (Cheapest)', modalities: ['image', 'text'] },
  { id: 'google/gemini-3-pro-image-preview', name: 'Gemini 3 Pro Image (High quality)', modalities: ['image', 'text'] },
  { id: 'google/gemini-3.1-flash-image-preview', name: 'Gemini 3.1 Flash Image (Newest)', modalities: ['image', 'text'] },
];

// ═══════════ API HELPERS ═══════════
function apiHeaders(key) {
  return { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json', 'HTTP-Referer': window.location.href, 'X-Title': 'LeadGen Content Engine' };
}

async function callOpenRouter(manualKey, model, sysPrompt, userPrompt) {
  const key = getApiKey(manualKey);
  const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', headers: apiHeaders(key),
    body: JSON.stringify({ model, messages: [{ role: 'system', content: sysPrompt }, { role: 'user', content: userPrompt }], temperature: 0.8, max_tokens: 2000 }),
  });
  if (!resp.ok) { const e = await resp.json().catch(() => ({})); throw new Error(e.error?.message || `API error: ${resp.status}`); }
  return (await resp.json()).choices[0].message.content;
}

function extractImageUrl(data) {
  const msg = data.choices?.[0]?.message;
  const content = msg?.content;
  if (msg?.images?.length > 0) {
    const img = msg.images[0];
    if (typeof img === 'string') return img;
    if (img?.image_url?.url) return img.image_url.url;
    if (img?.url) return img.url;
  }
  if (data.choices?.[0]?.native_images?.length > 0) return data.choices[0].native_images[0];
  if (Array.isArray(content)) {
    for (const part of content) {
      if (part.type === 'image_url' && (part.image_url?.url || part.url)) return part.image_url?.url || part.url;
      if (part.type === 'image') {
        if (part.source?.data) return `data:${part.source.media_type || 'image/png'};base64,${part.source.data}`;
        if (part.image_url?.url) return part.image_url.url;
        if (part.url) return part.url;
      }
    }
  }
  if (typeof content === 'string') {
    const b64 = content.match(/data:image\/[^;]+;base64,[A-Za-z0-9+/=]+/);
    if (b64) return b64[0];
    const md = content.match(/!\[.*?\]\((.*?)\)/);
    if (md) return md[1];
    const extUrl = content.match(/(https?:\/\/[^\s"'\)]+\.(png|jpg|jpeg|webp|gif)[^\s"'\)]*)/i);
    if (extUrl) return extUrl[1];
    const lineUrl = content.trim().match(/^(https?:\/\/[^\s]+)$/m);
    if (lineUrl) return lineUrl[1];
  }
  return null;
}

async function callImageAPI(manualKey, model, prompt) {
  const key = getApiKey(manualKey);
  const mc = IMAGE_MODELS.find(m => m.id === model) || IMAGE_MODELS[0];
  const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', headers: apiHeaders(key),
    body: JSON.stringify({ model: mc.id, messages: [{ role: 'user', content: prompt }], modalities: mc.modalities }),
  });
  if (!resp.ok) { const e = await resp.json().catch(() => ({})); throw new Error(e.error?.message || `Image API error: ${resp.status}`); }
  const data = await resp.json();
  const url = extractImageUrl(data);
  if (url) return url;
  console.error('[LeadGen] Unrecognized image response:', JSON.stringify(data).substring(0, 800));
  throw new Error('No image in response. Try a different model.');
}

async function generateImagePrompts(manualKey, textModel, postText, brand, count = 5) {
  const key = getApiKey(manualKey);
  const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', headers: apiHeaders(key),
    body: JSON.stringify({
      model: textModel,
      messages: [{ role: 'user', content: `You are a social media visual strategist. Based on the LinkedIn/Facebook post below, generate exactly ${count} different image descriptions for AI image generation.\n\nPOST:\n${postText}\n\nBRAND: ${brand.name || 'B2B Company'}\nBRAND COLORS: navy (#1a365d), steel blue (#2c5282), accent blue (#3182ce)\n\nRULES:\n- Each description must be a specific, detailed prompt for AI image generation (2-3 sentences)\n- Each image covers a DIFFERENT angle or message from the post\n- Professional, modern, corporate \u2014 suitable for LinkedIn/Facebook\n- Include composition, mood, color palette, and style details\n- 16:9 landscape format\n- No text/words/letters in the images\n- Mix: data visualizations, professional scenes, conceptual illustrations, environmental shots\n- No stock photo cliches\n\nReturn ONLY a JSON array of ${count} strings. No markdown, no code blocks.\n["prompt 1", "prompt 2", ...]` }],
      temperature: 0.9, max_tokens: 1500,
    }),
  });
  if (!resp.ok) throw new Error('Failed to generate image prompts');
  let raw = (await resp.json()).choices?.[0]?.message?.content || '';
  raw = raw.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
  try { const p = JSON.parse(raw); if (Array.isArray(p) && p.length >= 1) return p.slice(0, count); } catch {}
  const matches = raw.match(/"([^"]{20,})"/g);
  if (matches?.length >= 1) return matches.slice(0, count).map(s => s.replace(/^"|"$/g, ''));
  throw new Error('Could not parse image prompts');
}

async function generateMultipleImages(manualKey, imageModel, prompts, onProgress) {
  const results = [];
  const fallbackModels = IMAGE_MODELS.filter(m => m.id !== imageModel).map(m => m.id);
  for (let i = 0; i < prompts.length; i++) {
    if (onProgress) onProgress(i, prompts.length);
    let success = false;
    const modelsToTry = [imageModel, ...fallbackModels.slice(0, 2)];
    for (const model of modelsToTry) {
      try {
        const url = await callImageAPI(manualKey, model, prompts[i]);
        results.push({ url, prompt: prompts[i], error: null, model });
        success = true; break;
      } catch (e) { console.warn(`[LeadGen] Image ${i + 1} failed on ${model}:`, e.message); }
    }
    if (!success) results.push({ url: null, prompt: prompts[i], error: 'All models failed' });
  }
  return results;
}

// ═══════════ PROMPT BUILDERS ═══════════
function buildSystemPrompt(brand, platform, opts = {}) {
  const { tone, ctaType, useEmoji, formatting } = opts;
  const toneMap = {
    authoritative: 'Direct, authoritative, data-driven voice. You are the expert.',
    conversational: 'Warm, conversational, relatable voice. Like talking to a smart colleague.',
    provocative: 'Bold, contrarian, thought-provoking voice. Challenge conventional thinking.',
    storytelling: 'Narrative-driven voice. Open with a scene or moment. Pull the reader in.',
    educational: 'Clear, instructive voice. Teach something valuable. Be specific.',
  };
  const ctaMap = {
    question: 'End with a thought-provoking question that invites comments.',
    dm: 'End with a DM-based CTA (e.g., DM me "GUIDE" to get...).',
    link: 'End with a CTA pointing to a link or resource.',
    engage: 'End by asking readers to share their experience or opinion.',
    none: 'No explicit CTA. Let the content speak for itself.',
  };
  return `You are an expert social media content strategist for B2B lead generation on ${platform}.\n\nBRAND: ${brand.name || 'the client'}\nTagline: ${brand.tagline || 'N/A'}\nCategory: ${brand.category || 'N/A'}\nPillars: ${brand.pillars.map(p => p.name).join(', ')}\n\nVOICE & TONE:\n${toneMap[tone] || toneMap.authoritative}\n\nFORMATTING RULES:\n- Hook in first 2 lines\n- Short paragraphs (1-3 sentences max), generous line breaks\n- ${formatting === 'heavy' ? 'Use bullet points with \u2192 arrows, numbered lists, and bold structural markers (**bold** for key phrases)' : formatting === 'minimal' ? 'Minimal formatting. Flowing prose. No lists unless absolutely necessary.' : 'Mix of short paragraphs and \u2192 arrow lists where they add clarity. Use **bold** for 1-2 key phrases.'}\n- ${platform === 'LinkedIn' ? 'Professional but human. Use \u2192 arrow symbols for lists.' : 'Warmer tone, more shareable. Occasional emojis OK.'}\n- ${useEmoji ? 'Use 2-3 relevant emojis to break up text and add visual interest.' : 'No emojis. Let the words do the work.'}\n- 3-5 relevant hashtags at end\n- 200-350 words\n- Every sentence earns its place. No filler.\n\nCTA STYLE:\n${ctaMap[ctaType] || ctaMap.question}`;
}

function buildUserPrompt(pillar, audience, topic, dataPoints, imageStyle, opts = {}) {
  const { keywords, keyPhrases, avoidTopics } = opts;
  let p = `Write a ${pillar.name} post targeting ${audience || pillar.audience}.`;
  if (topic) p += `\n\nTopic/Angle: ${topic}`;
  if (keywords?.length) p += `\n\nKeywords to weave in naturally: ${keywords.join(', ')}`;
  if (keyPhrases?.length) p += `\n\nKey phrases to include or riff on:\n${keyPhrases.map(k => `- "${k}"`).join('\n')}`;
  if (avoidTopics?.length) p += `\n\nAvoid these topics/angles: ${avoidTopics.join(', ')}`;
  if (dataPoints?.length) p += `\n\nData points (use 1-2 max):\n${dataPoints.map(d => `- ${d}`).join('\n')}`;
  if (imageStyle === 'stat') p += '\n\nThis post is paired with a bold stat-card image. Reference a striking number early.';
  if (imageStyle === 'multi') p += '\n\nThis post is paired with a multi-image carousel (problem\u2192context\u2192solution). Structure the post to match.';
  if (imageStyle === 'quote') p += '\n\nThis post is paired with a quote card. Lead with a strong, quotable opinion.';
  p += '\n\nReturn ONLY the raw post text. No labels, titles, or commentary. Use **bold** for key phrases.';
  return p;
}

// ═══════════ CANVAS IMAGE GENERATORS ═══════════
function wrapText(ctx, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '', n = 0;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + ' ';
    if (ctx.measureText(test).width > maxW && i > 0) { ctx.fillText(line.trim(), x, y); line = words[i] + ' '; y += lh; n++; if (n > 8) break; } else { line = test; }
  }
  ctx.fillText(line.trim(), x, y); return y;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function generateStatCard(cv, opts) {
  const ctx=cv.getContext('2d'), W=1200, H=628; cv.width=W; cv.height=H;
  const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,opts.colors.primary); g.addColorStop(1,opts.colors.secondary||opts.colors.primary); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=opts.colors.accent||'#3b82f6'; ctx.fillRect(200,60,320,4); ctx.fillStyle=opts.colors.light||'#bee3f8'; ctx.font='600 16px Inter,sans-serif'; ctx.textAlign='left'; ctx.fillText((opts.category||'INSIGHT').toUpperCase(),200,50);
  ctx.fillStyle='#fff'; ctx.font='900 120px Inter,sans-serif'; const stat=opts.stat||'86,000'; ctx.fillText(stat,190,240);
  ctx.fillStyle=opts.colors.accent||'#3b82f6'; ctx.fillRect(190,260,Math.min(ctx.measureText(stat).width,500),4);
  ctx.fillStyle='#fff'; ctx.font='700 36px Inter,sans-serif'; wrapText(ctx,opts.label||'Key metric.',190,320,700,44);
  if(opts.subtitle){ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='400 20px Inter,sans-serif';wrapText(ctx,opts.subtitle,190,420,700,28);}
  ctx.fillStyle=opts.colors.accent||'#3b82f6'; ctx.fillRect(0,H-50,W,50); ctx.fillStyle='#fff'; ctx.font='700 16px Inter,sans-serif'; ctx.textAlign='left'; ctx.fillText((opts.brandName||'YOUR BRAND').toUpperCase(),30,H-18); ctx.textAlign='right'; ctx.font='400 14px Inter,sans-serif'; ctx.fillText(opts.tagline||'',W-30,H-18);
  ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(190,490); ctx.lineTo(220,490); ctx.lineTo(230,470); ctx.lineTo(240,510); ctx.lineTo(250,480); ctx.lineTo(260,490); ctx.lineTo(350,490); ctx.stroke();
}
function generateQuoteCard(cv, opts) {
  const ctx=cv.getContext('2d'), W=1200, H=628; cv.width=W; cv.height=H;
  const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#2d4a6f'); g.addColorStop(1,opts.colors.primary||'#1a365d'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.font='900 200px Georgia,serif'; ctx.textAlign='left'; ctx.fillText('\u201C',40,180);
  ctx.fillStyle='#fff'; ctx.font='700 32px Inter,sans-serif'; wrapText(ctx,opts.quote||'Your perspective here.',80,210,520,42);
  ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='400 18px Inter,sans-serif'; ctx.fillText(opts.brandName||'Your Brand',80,480); ctx.font='400 14px Inter,sans-serif'; ctx.fillText(opts.role||'',80,505);
  ctx.fillStyle='rgba(255,255,255,.08)'; roundRect(ctx,650,80,480,470,12); ctx.fill();
  if(opts.context){ctx.fillStyle='#fff';ctx.font='600 20px Inter,sans-serif';wrapText(ctx,opts.context,680,130,420,30);}
  if(opts.closingLine){ctx.fillStyle='#fff';ctx.font='800 24px Inter,sans-serif';wrapText(ctx,opts.closingLine,680,440,420,32);}
  ctx.fillStyle=opts.colors.accent||'#3b82f6'; ctx.fillRect(0,H-50,W,50); ctx.fillStyle='#fff'; ctx.font='700 16px Inter,sans-serif'; ctx.textAlign='left'; ctx.fillText((opts.brandName||'YOUR BRAND').toUpperCase(),30,H-18); ctx.textAlign='right'; ctx.font='400 14px Inter,sans-serif'; ctx.fillText(opts.tagline||'',W-30,H-18);
}
function generateMultiCard(cv, opts) {
  const ctx=cv.getContext('2d'), W=1200, H=628; cv.width=W; cv.height=H;
  ctx.fillStyle='#f1f5f9'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=opts.colors.primary||'#1a365d'; ctx.fillRect(0,0,100,H); ctx.fillStyle='#fff'; ctx.font='700 48px Inter,sans-serif'; ctx.textAlign='center'; ctx.fillText(opts.cardNumber||'1',50,310); ctx.font='400 20px Inter,sans-serif'; ctx.fillText('of',50,340); ctx.fillText(opts.totalCards||'3',50,370);
  ctx.fillStyle=opts.colors.primary||'#1a365d'; ctx.font='700 14px Inter,sans-serif'; ctx.textAlign='left'; ctx.fillText((opts.topicLabel||'TOPIC').toUpperCase(),200,60); ctx.fillStyle=opts.colors.accent||'#3b82f6'; ctx.fillRect(200,70,200,3);
  ctx.fillStyle=opts.colors.primary||'#1a365d'; roundRect(ctx,W-120,20,90,90,8); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='700 14px Inter,sans-serif'; ctx.textAlign='center'; ctx.fillText(opts.brandName?opts.brandName.split(' ')[0].toUpperCase():'BRAND',W-75,70); ctx.textAlign='left';
  if(opts.title){ctx.fillStyle=opts.colors.primary||'#1a365d';ctx.font='800 42px Inter,sans-serif';wrapText(ctx,opts.title,200,160,800,52);}
  if(opts.subtitle){ctx.fillStyle=opts.colors.primary||'#1a365d';ctx.font='800 38px Inter,sans-serif';wrapText(ctx,opts.subtitle,200,420,800,46);if(opts.subSubtitle){ctx.fillStyle='#64748b';ctx.font='400 20px Inter,sans-serif';ctx.fillText(opts.subSubtitle,200,510);}}
  if(opts.tagLabel){ctx.font='600 13px Inter,sans-serif';const tw=ctx.measureText(opts.tagLabel.toUpperCase()).width+40;ctx.fillStyle=opts.colors.primary||'#1a365d';roundRect(ctx,W-tw-30,H-70,tw,36,6);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(opts.tagLabel.toUpperCase(),W-tw/2-30,H-47);}
  ctx.fillStyle=opts.colors.primary||'#1a365d'; ctx.font='700 14px Inter,sans-serif'; ctx.textAlign='left'; ctx.fillText((opts.brandName||'YOUR BRAND').toUpperCase(),120,H-20);
}

// ═══════════ PRESETS ═══════════
const STEADFAST_PRESET = {
  name: 'Steadfast Physician Partners', tagline: 'Reliable Physician Coverage. Deployed Fast.',
  category: 'The company that helps hospitals eliminate physician coverage gaps before they become crises.',
  colors: { primary: '#1a365d', secondary: '#2c5282', accent: '#3182ce', light: '#bee3f8', bg: '#1a365d', text: '#ffffff' },
  pillars: [
    { name: 'Workforce Insights', audience: 'Hospital Leaders', description: 'Data-driven content about physician shortages and capacity gaps' },
    { name: 'Physician Lifestyle', audience: 'Physicians', description: 'Content for physicians considering locum work and career flexibility' },

    { name: 'Industry Commentary', audience: 'Both', description: 'Hot takes on healthcare policy, Match results, market shifts' },

    { day: 'Tuesday', time: '7:30 AM', pillar: 'Industry Commentary', audience: 'Both', imageStyle: 'stat' },
    { day: 'Tuesday', time: '12:00 PM', pillar: 'Workforce Insights', audience: 'Hospital Leaders', imageStyle: 'multi' },
    { day: 'Wednesday', time: '7:30 AM', pillar: 'Physician Lifestyle', audience: 'Physicians', imageStyle: 'quote' },
    { day: 'Wednesday', time: '12:00 PM', pillar: 'Staffing Strategy', audience: 'Hospital Leaders', imageStyle: 'stat' },
    { day: 'Thursday', time: '12:00 PM', pillar: 'Staffing Strategy', audience: 'Hospital Leaders', imageStyle: 'multi' },
    { day: 'Thursday', time: '5:15 PM', pillar: 'Lead Magnet', audience: 'Hospital Leaders', imageStyle: 'stat' },
  ],
  dataPoints: [
    '86,000 projected physician shortage by 2036',

// ═══════════ FORMATTED POST RENDERER ═══════════
function renderInline(text) {
  if (!text) return text;
  const parts = []; let remaining = text; let key = 0;
  while (remaining.length > 0) {
    const boldMatch = remaining.match(/\*\*(.+?)\*\*/);
    if (boldMatch) {
      const idx = remaining.indexOf(boldMatch[0]);
      if (idx > 0) parts.push(React.createElement('span', { key: key++ }, remaining.substring(0, idx)));
      parts.push(React.createElement('strong', { key: key++, className: 'font-bold text-gray-900' }, boldMatch[1]));
      remaining = remaining.substring(idx + boldMatch[0].length);
      continue;
    }
    parts.push(React.createElement('span', { key: key++ }, remaining));
    break;
  }
  return parts.length === 1 ? parts[0] : parts;
}

function FormattedPost({ text }) {
  if (!text) return null;
  const lines = text.split('\n');
  const elements = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim() === '') { elements.push(React.createElement('div', { key: i, className: 'h-2' })); continue; }
    const bulletMatch = line.match(/^\s*([\u2192\u2022\-\*]|\d+[\.\)])\s+(.*)/);
    if (bulletMatch) {
      const marker = bulletMatch[1];
      const content = bulletMatch[2];
      elements.push(React.createElement('div', { key: i, className: 'flex items-start gap-2 pl-2 py-0.5' },
        React.createElement('span', { className: 'text-blue-500 font-bold shrink-0 mt-0.5' }, marker === '-' || marker === '*' ? '\u2192' : marker),
        React.createElement('span', null, renderInline(content))
      ));
      continue;
    }
    elements.push(React.createElement('p', { key: i, className: 'py-0.5' }, renderInline(line)));
  }
  return React.createElement(React.Fragment, null, ...elements);
}

// ═══════════ MAIN APP ═══════════
function App() {
  const h = React.createElement;
  const [page,setPage]=useState('generate');
  const [brand,setBrand]=useState(STEADFAST_PRESET);
  const [manualKey,setManualKey]=useState('');
  const [selModel,setSelModel]=useState(TEXT_MODELS[0].id);
  const [selImgModel,setSelImgModel]=useState(IMAGE_MODELS[0].id);
  const [toast,setToast]=useState(null);
  const [savedPosts,setSavedPosts]=useState([]);
  const live=isLiveMode(manualKey);
  const showToast=msg=>setToast(msg);

  return h('div',{className:'min-h-screen gradient-bg'},
    h(Header,{brand,manualKey,setManualKey,live}),
    h(NavBar,{page,setPage}),
    h('main',{className:'p-6 max-w-7xl mx-auto'},
      page==='generate'&&h(GeneratePage,{brand,manualKey,selModel,selImgModel,live,showToast,savedPosts,setSavedPosts}),
      page==='calendar'&&h(CalendarPage,{brand}),
      page==='saved'&&h(SavedPage,{savedPosts,setSavedPosts,showToast}),
      page==='images'&&h(ImageStudioPage,{brand,manualKey,selImgModel,live,showToast}),
      page==='settings'&&h(SettingsPage,{brand,setBrand,manualKey,setManualKey,selModel,setSelModel,selImgModel,setSelImgModel,live})
    ),
    toast&&h(Toast,{message:toast,onClose:()=>setToast(null)})
  );
}

// ─── RENDER ───
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
